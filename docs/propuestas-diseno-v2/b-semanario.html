<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Semanario — LinkYouth /inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f2f1ef;
  --sobre:#ffffff;
  --tinta:#1c1b1f;
  --tinta-2:#46444d;
  --tinta-3:#5b5966;
  --regla:#847f8e;
  --acento:#5b21b6;
  --acento-fuerte:#4c1d95;
  --acento-tenue:#ede7fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.55}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px}

.barra{display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:16px 40px;background:var(--sobre);border-bottom:1px solid var(--regla)}
.marca{font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:.06em;line-height:1}
.marca b{color:var(--acento);font-weight:400}
.quien{font-size:14px;color:var(--tinta-3)}
.quien strong{color:var(--tinta-2);font-weight:600}

.hoja{max-width:1060px;margin:0 auto;padding:38px 40px 90px}

/* encabezado: el título es el elemento, no un h1 chiquito arriba de una tarjeta */
.encabezado{margin:0 0 30px}
.encabezado h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:76px;line-height:.92;
  letter-spacing:.012em;margin:0;max-width:16ch}
.encabezado p{margin:12px 0 0;font-size:17px;color:var(--tinta-2);max-width:58ch}

.mandos{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 6px;
  padding:0 0 14px}
.mandos button{background:none;border:0;border-bottom:3px solid transparent;
  padding:5px 2px;margin-right:14px;font:inherit;font-size:16px;font-weight:600;
  color:var(--tinta-3);cursor:pointer}
.mandos button[aria-pressed=true]{color:var(--acento-fuerte);border-bottom-color:var(--acento)}
.mandos .cuenta{margin-left:auto;font-size:14px;color:var(--tinta-3);font-variant-numeric:tabular-nums}

/* El espinazo: una sola regla vertical continua. Se dibuja como borde de la
   columna del medio y no como pseudo-elemento absoluto, así los tramos de
   filas consecutivas se encadenan solos y nada queda superpuesto al texto. */
.linea{margin:0;padding:0;list-style:none}
.hito{display:grid;grid-template-columns:104px 34px minmax(0,1fr);gap:0 0;padding:22px 0}
.fecha{grid-column:1;text-align:right;padding-right:22px}
.fecha .dia{font-family:"Bebas Neue",sans-serif;font-size:46px;line-height:.86;letter-spacing:.02em;
  display:block;font-variant-numeric:tabular-nums}
.fecha .mes{font-size:12.5px;font-weight:600;color:var(--tinta-3);letter-spacing:.08em;display:block;margin-top:3px}
.fecha .hora{font-size:12.5px;color:var(--tinta-3);display:block}
/* el punto se apoya sobre el espinazo */
.punto{grid-column:2;position:relative;border-left:2px solid var(--regla)}
.punto::after{content:"";position:absolute;left:-8px;top:12px;width:12px;height:12px;border-radius:50%;
  background:var(--papel);border:3px solid var(--acento)}
.hito.evento .punto::after{background:var(--acento)}
/* el espinazo no sobresale por arriba del primer hito ni por debajo del último */
.hito:first-child .punto{background:linear-gradient(var(--papel),var(--papel)) no-repeat left top/2px 20px}
.hito:last-child .punto{background:linear-gradient(var(--papel),var(--papel)) no-repeat left bottom/2px 28px}
.cuerpo{grid-column:3;padding-left:8px}
.quien-pone{font-size:13.5px;color:var(--tinta-3)}
.cuerpo h2{margin:2px 0 0;font-size:23px;line-height:1.2;font-weight:600;max-width:26ch}
.cuerpo p{margin:7px 0 0;font-size:15.5px;color:var(--tinta-2);max-width:60ch;line-height:1.6}
.marcas{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px}
.marcas li{font-size:13px;padding:2px 9px;border:1px solid var(--regla);border-radius:2px;color:var(--tinta-2)}
.marcas li.propia{border-color:var(--acento);background:var(--acento-tenue);color:var(--acento-fuerte);font-weight:600}
.acciones{margin:15px 0 0;display:flex;align-items:center;gap:14px}
.acciones button{background:var(--acento);border:0;color:#fff;border-radius:2px;padding:9px 20px;
  font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.acciones button:hover{background:var(--acento-fuerte)}
.acciones button.secundaria{background:none;color:var(--acento-fuerte);border:1px solid var(--regla)}
.acciones button.secundaria:hover{background:var(--sobre)}
.acciones .meta{font-size:13.5px;color:var(--tinta-3)}

.vacio{padding:50px 0 0;font-size:17px;color:var(--tinta-3)}

@media (max-width:820px){
  .hoja{padding:26px 20px 70px}
  .encabezado h1{font-size:50px}
    .hito{grid-template-columns:58px 26px minmax(0,1fr)}
  .fecha{padding-right:14px}
  .fecha .dia{font-size:32px}
  .cuerpo h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="barra">
  <div class="marca">Link<b>Youth</b></div>
  <div class="quien"><strong>Mateo Silveira</strong>, Ingeniería en Computación</div>
</header>

<main class="hoja">

  <div class="encabezado">
    <h1>Lo que pasa esta semana en tu área</h1>
    <p>Llamados abiertos y actividades, en una sola línea de tiempo, del más reciente al más lejano.</p>
  </div>

  <div class="mandos" role="group" aria-label="Filtrar la línea de tiempo">
    <button type="button" data-f="todo" aria-pressed="true">Todo</button>
    <button type="button" data-f="empleo" aria-pressed="false">Llamados</button>
    <button type="button" data-f="evento" aria-pressed="false">Actividades</button>
    <span class="cuenta" id="cuenta"></span>
  </div>

  <ol class="linea" id="linea"></ol>

</main>

<script>
const YO = new Set(["React","TypeScript","JavaScript","HTML y CSS","Git","SQL","Inglés B2","Trabajo en equipo","Comunicación","Desarrollo web","Diseño de interfaces","Primera experiencia"].map(s=>s.toLowerCase()));

const HITOS = [
  {clase:"empleo",tipo:"Empleo",dia:"13",mes:"SET",hora:"hace 3 h",empresa:"Mercado Libre",
   titulo:"Desarrollador Frontend Junior",
   texto:"Equipo de design system. Componentes reutilizables en React y TypeScript, con un referente técnico durante los primeros seis meses.",
   marcas:["React","TypeScript","HTML y CSS","Git"],meta:"2 posiciones",accion:"Postularme"},
  {clase:"empleo",tipo:"Pasantía",dia:"13",mes:"SET",hora:"hace 9 h",empresa:"PedidosYa",
   titulo:"Pasantía en Ingeniería de Interfaces",
   texto:"Seis meses rentados en el equipo de checkout, sobre la interfaz que usan miles de personas por día. Revisión de código y mentoría semanal.",
   marcas:["React","JavaScript","HTML y CSS"],meta:"3 posiciones",accion:"Postularme"},
  {clase:"empleo",tipo:"Empleo",dia:"12",mes:"SET",hora:"hace 1 día",empresa:"dLocal",
   titulo:"Analista de Datos Junior",
   texto:"Reportes de negocio: consultas SQL, tableros y presentación de hallazgos al equipo comercial.",
   marcas:["SQL","Planillas de cálculo","Inglés B2"],meta:"1 posición",accion:"Postularme"},
  {clase:"empleo",tipo:"Pasantía",dia:"11",mes:"SET",hora:"hace 2 días",empresa:"Mercado Libre",
   titulo:"Pasantía en Atención al Cliente",
   texto:"Primera experiencia en posventa. Formación paga las primeras cuatro semanas y horario compatible con estudio.",
   marcas:["Comunicación","Trabajo en equipo"],meta:"5 posiciones",accion:"Postularme"},
  {clase:"evento",tipo:"Taller",dia:"23",mes:"SET",hora:"18:30",empresa:"PedidosYa",
   titulo:"Cómo preparar tu primera entrevista técnica",
   texto:"Dos horas con personas que entrevistan a diario. Se trabaja sobre casos reales y se sale con una devolución individual.",
   marcas:["Primera experiencia","Desarrollo web"],meta:"Gratis",accion:"Anotarme"},
  {clase:"evento",tipo:"Feria",dia:"04",mes:"OCT",hora:"14:00",empresa:"Universidad de la República",
   titulo:"Feria de Primer Empleo Tecnológico",
   texto:"Charlas cortas, rondas de entrevistas breves y espacio de consultas sobre pasantías.",
   marcas:["Primera experiencia","Networking"],meta:"Gratis",accion:"Anotarme"},
  {clase:"evento",tipo:"Charla",dia:"15",mes:"OCT",hora:"19:00",empresa:"dLocal",
   titulo:"Primeros pasos en análisis de datos",
   texto:"El trabajo cotidiano de un equipo de datos, las herramientas que usan y cómo es la selección para perfiles junior.",
   marcas:["Datos","Networking"],meta:"Gratis",accion:"Anotarme"},
];

let filtro = "todo";

function pintar(){
  const lista = HITOS.filter(h => filtro==="todo" || h.clase===filtro);
  document.getElementById("cuenta").textContent =
    lista.length + (lista.length===1 ? " entrada" : " entradas");
  document.getElementById("linea").innerHTML = lista.length ? lista.map(h=>`
    <li class="hito ${h.clase==="evento"?"evento":""}">
      <div class="fecha">
        <span class="dia">${h.dia}</span>
        <span class="mes">${h.mes}</span>
        <span class="hora">${h.hora}</span>
      </div>
      <div class="punto" aria-hidden="true"></div>
      <div class="cuerpo">
        <p class="quien-pone">${h.tipo} en ${h.empresa}</p>
        <h2>${h.titulo}</h2>
        <p>${h.texto}</p>
        <ul class="marcas">${h.marcas.map(m=>
          `<li class="${YO.has(m.toLowerCase())?"propia":""}">${m}</li>`).join("")}</ul>
        <div class="acciones">
          <button type="button" class="${h.clase==="evento"?"secundaria":""}">${h.accion}</button>
          <span class="meta">${h.meta}</span>
        </div>
      </div>
    </li>`).join("") : `<p class="vacio">No hay nada en esta vista todavía.</p>`;
}

document.querySelector(".mandos").addEventListener("click", ev=>{
  const b = ev.target.closest("button");
  if(!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll(".mandos button")
    .forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  pintar();
});

pintar();
</script>
</body>
</html>
