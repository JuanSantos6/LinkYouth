<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio · LinkYouth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="marco">
  <div id="barra"></div>
  <div class="contenido">
    <div class="dos-columnas">
      <main class="pila">
        <header class="encabezado">
          <h1 id="saludo"></h1>
          <p>Estas son las oportunidades y los eventos que mejor coinciden con las habilidades de tu perfil.</p>
        </header>

        <div id="aviso"></div>

        <nav class="pestanas" aria-label="Vista del feed">
          <a href="inicio.html" aria-current="page">Oportunidades laborales</a>
          <a href="inicio.html?vista=eventos">Eventos de networking</a>
        </nav>

        <section class="pila" id="feed" aria-label="Oportunidades laborales"></section>
      </main>

      <aside id="ficha"></aside>
    </div>
  </div>
</div>

<script src="datos.js"></script>
<script>
montar("inicio.html");
document.getElementById("saludo").textContent = "Hola, " + PERFIL.nombre;
document.getElementById("aviso").innerHTML = avisoDemo();
document.getElementById("ficha").innerHTML = fichaUsuario();

const verEventos = new URLSearchParams(location.search).get("vista") === "eventos";
const feed = document.getElementById("feed");
const pestanas = document.querySelectorAll(".pestanas a");

if (verEventos) {
  pestanas[0].removeAttribute("aria-current");
  pestanas[1].setAttribute("aria-current", "page");
  feed.setAttribute("aria-label", "Eventos de networking");
  feed.innerHTML = EVENTOS.map(tarjetaEvento).join("");
} else {
  feed.innerHTML = [...VACANTES]
    .sort((a, b) => afinidad(b) - afinidad(a))
    .map(tarjetaVacante).join("");
}
</script>
</body>
</html>
