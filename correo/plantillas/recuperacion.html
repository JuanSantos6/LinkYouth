<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f7f6fb;
      font-family: &quot;Red Hat Text&quot;, Arial, sans-serif;
      color: #1e1a38;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        border: 1px solid #e4e1ee;
      "
    >
      <tr>
        <td style="padding: 32px">
          <p
            style="
              margin: 0 0 24px;
              font-size: 20px;
              font-weight: 700;
              color: #6541e0;
            "
          >
            LinkYouth
          </p>
          <h1 style="margin: 0 0 12px; font-size: 22px; line-height: 1.3">
            Elegí una contraseña nueva
          </h1>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.55">
            Alguien pidió cambiar la contraseña de la cuenta de LinkYouth
            asociada a {{ .Email }}. Si fuiste vos, tocá el botón.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery"
              style="
                display: inline-block;
                padding: 12px 22px;
                border-radius: 999px;
                background: #f25c1a;
                color: #1e1a38;
                font-weight: 700;
                text-decoration: none;
              "
              >Elegir contraseña nueva</a
            >
          </p>
          <p
            style="margin: 0; font-size: 14px; line-height: 1.5; color: #5b5770"
          >
            El enlace sirve una sola vez y vence en una hora. Si no lo pediste,
            ignorá este correo: tu contraseña sigue igual.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
